# SCOUT without task/map inputs (frames only) on BDD-A, trained on the gazehead manifests
# (bdda_train / bdda_val; test = bdda_test_scored).  The "worked" counterpart of the paper row.
# Intended path: /opt/SCOUT/configs/bdda_wo_task.yaml
# Cloned from configs/SCOUT.yaml; changes: dataset, use_task False, no_epochs 20 (paper; shipped yaml says 10).
# Strides are SCOUT's own (obs_length//2 = 8 train/val, 1 test) — see dataloader_gazehead.py.
model_class: SCOUT_task

dataset: BDDA_gazehead

last_weights: None

best_weights: None

model_params:
  img_size: [224,224]
  use_task: False
  task_attributes: ['current_action', 'local_context']   # unused when use_task is False

  transformer_params:
    add_and_norm: True
    fuse_idx: [1, 2]
    num_att_heads: [2, 2, 2]

  pretrained_backbone: True    # Swin-S, Kinetics-400
  train_backbone: True
  num_encoder_layers: 4
  clip_size: 16                # 0.55 s at 29 fps

train_params:
  no_epochs: 20
  lr: 0.0001
  loss:
    kldiv: True
    kldiv_coeff: 1.0
    cc: False
    cc_coeff: -1.0
    nss: False
    nss_coeff: 1.0
    sim: False
    sim_coeff: -1.0
    l1: False
    l1_coeff: 1.0
  lr_sched: True
  early_stop: True
  optimizer: Adam
  batch_size: 4
  log_interval: 10
  no_workers: 6
  weighted_sampler: False
  weighted_loss: False
  weight_type: KLdiv

test_params:
  batch_size: 4
  eval: null                   # predictions by /opt/gazehead/tools/predict_scout.py
  metrics: [KLdiv, NSS, SIM, CC]
  save_images: False
